[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "the-os"
version = "0.1.0.dev0"
description = "Assistant-first Windows environment centered on LYRA"
requires-python = ">=3.14,<3.15"
dependencies = [
  "PySide6==6.10.3",
  "pydantic==2.13.5",
  "httpx==0.28.1",
  "SQLAlchemy==2.1.1",
  "alembic==1.20.0",
  "psutil==7.2.2",
  "pywin32==312",
  "python-dotenv==1.2.3",
  "structlog==26.1.0"
]

[project.optional-dependencies]
voice = [
  "sounddevice==0.5.6",
  "numpy==2.5.3"
]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.9"
]

[project.scripts]
theos = "theos.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]